<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qin Coin Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#6CCBFF; --sky2:#C9F0FF; --card:#FFFFFF; --ink:#1E1846; --text:#1E1846; --muted:#4A4775;
  --yellow:#FFD23F; --pink:#FF5DA2; --purple:#8A4FFF; --green:#2FCB75; --orange:#FF8C42; --red:#FF4B4B; --blue:#2E9BFF;
  --soft:#EEF6FF; --okbg:#D9FBE7; --selbg:#FFF4C2;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#1B1446; --sky2:#3A2A8C; --card:#2B2366; --ink:#0B0822; --text:#FFFFFF; --muted:#CFC9FF;
    --soft:#3A3180; --okbg:#1F5A44; --selbg:#5A4A12; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --sky1:#1B1446; --sky2:#3A2A8C; --card:#2B2366; --ink:#0B0822; --text:#FFFFFF; --muted:#CFC9FF;
  --soft:#3A3180; --okbg:#1F5A44; --selbg:#5A4A12; color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--sky1),var(--sky2)) fixed;background-color:var(--sky1);color:var(--text);font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-weight:800;font-size:17px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--purple)}
.fun{font-family:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-weight:400;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
.chunky{border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink)}
.press{transition:transform .08s, box-shadow .08s}
.press:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--purple);border-bottom:3px solid var(--ink)}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);color:var(--text);border:3px solid var(--ink);border-radius:999px;padding:4px 12px 4px 6px;box-shadow:0 3px 0 var(--ink);font-family:"Lilita One",sans-serif;font-size:20px;line-height:1}
.badge{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-size:13px;color:#fff;font-family:"Lilita One",sans-serif;flex:none}
.coin{--s:30px;width:var(--s);height:var(--s);border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#FFF3A8,#FFD23F 50%,#E0A100);border:3px solid var(--ink);position:relative}
.coin::after{content:"";position:absolute;inset:30%;background:var(--ink);border-radius:2px}
.timer{background:var(--card)}
.timer.danger{background:var(--red);color:#fff;animation:wob .6s infinite}
@keyframes wob{50%{transform:scale(1.07)}}
.hud .spacer{flex:1}
.hudbtn{background:var(--yellow);color:#1E1846;border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:6px 12px;font-family:"Lilita One",sans-serif;font-size:17px}
.hudbtn.pink{background:var(--pink);color:#fff}
main{max-width:860px;margin:0 auto;padding:16px 12px 60px}
.card{background:var(--card);color:var(--text);padding:16px}
h1,h2,h3{margin:0 0 8px;font-family:"Lilita One",sans-serif;font-weight:400}
h1{font-size:clamp(34px,9vw,56px);line-height:1}
h2{font-size:clamp(24px,6vw,32px);line-height:1.1}
h3{font-size:20px}
.muted{color:var(--muted);font-weight:700}
.how{background:var(--soft);border:3px dashed var(--ink);border-radius:14px;padding:10px 12px;margin:8px 0 14px;font-weight:800}
.how ol{margin:4px 0 0;padding-left:22px}
.btn{background:var(--card);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:10px 16px;font-weight:900}
.btn.go{background:var(--green);color:#10331F;font-family:"Lilita One",sans-serif;font-weight:400;font-size:20px}
.btn.yellow{background:var(--yellow);color:#1E1846}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 4px 0 var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.teams{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.teambtn{background:var(--card);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:"Lilita One",sans-serif;font-size:20px}
.teambtn .badge{width:60px;height:60px;font-size:18px}
/* map */
.map{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.zone{background:var(--card);padding:14px;text-align:left;display:flex;gap:12px;align-items:center;position:relative}
.zone .em{font-size:40px;line-height:1;width:58px;height:58px;display:grid;place-items:center;border-radius:16px;border:3px solid var(--ink);flex:none}
.zone .zt{font-family:"Lilita One",sans-serif;font-size:21px;display:block}
.zone .zs{font-size:14px;color:var(--muted)}
.stamp{position:absolute;top:-10px;right:-6px;background:var(--green);color:#10331F;border:3px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:14px;transform:rotate(6deg)}
.stamp.storm{background:var(--purple);color:#fff}
.stamp.play{background:var(--yellow);color:#1E1846}
/* tiles */
.tile{background:var(--card);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:10px;min-height:56px;display:flex;align-items:center;gap:10px;text-align:left;font-weight:800;width:100%}
.tile .em{font-size:30px;line-height:1;flex:none}
.tile.sel{background:var(--selbg);outline:4px solid var(--yellow);outline-offset:1px}
.tile.ok{background:var(--okbg);cursor:default;box-shadow:0 2px 0 var(--ink)}
.tile.bad{background:var(--red);color:#fff;animation:shake .35s}
.tile .tag{margin-left:auto;background:var(--green);color:#10331F;border:2px solid var(--ink);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px;flex:none}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colhead{font-family:"Lilita One",sans-serif;font-size:17px;text-align:center;background:var(--yellow);color:#1E1846;border:3px solid var(--ink);border-radius:12px;padding:4px}
.cols .grid{gap:10px}
@media (max-width:480px){.tile{font-size:14px;padding:8px;gap:6px}.tile .em{font-size:24px}}
/* ladder */
.ladder{display:grid;gap:8px;justify-items:center;margin:6px 0 16px}
.step{border:3px dashed var(--ink);border-radius:14px;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 10px;background:var(--soft);font-weight:900}
.step.filled{border-style:solid;background:var(--card);box-shadow:0 4px 0 var(--ink)}
.step.ok{background:var(--okbg)}
.step .n{font-family:"Lilita One",sans-serif;color:var(--muted)}
.pool{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
/* code */
.cipher{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.cipher span{width:48px;height:56px;display:grid;place-items:center;background:var(--purple);color:#fff;border:3px solid var(--ink);border-radius:12px;font-family:"Lilita One",sans-serif;font-size:30px;box-shadow:0 4px 0 var(--ink)}
.key{overflow-x:auto;margin:10px 0;border:3px solid var(--ink);border-radius:12px;background:var(--card)}
.key table{border-collapse:collapse;font-family:"Lilita One",sans-serif;font-size:17px}
.key td{border-right:2px solid var(--soft);padding:4px 8px;text-align:center;min-width:30px}
.key tr:first-child td{background:var(--purple);color:#fff}
.key tr td:first-child{font-family:Nunito,sans-serif;font-weight:900;font-size:13px;white-space:nowrap}
input[type=text]{font:inherit;font-family:"Lilita One",sans-serif;font-size:24px;letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;border-radius:14px;border:3px solid var(--ink);background:var(--card);color:var(--text);width:180px}
input.bad{animation:shake .35s;background:var(--red);color:#fff}
/* boss */
.boss{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bossface{width:72px;height:72px;border-radius:50%;background:var(--red);border:3px solid var(--ink);display:grid;place-items:center;font-size:40px;flex:none;box-shadow:0 4px 0 var(--ink)}
.bossface.hit{animation:shake .35s}
.hpbar{display:flex;gap:3px;margin-top:6px;border:3px solid var(--ink);border-radius:10px;padding:3px;background:var(--card)}
.hpbar i{flex:1;height:14px;border-radius:4px;background:var(--red)}
.hpbar i.gone{background:var(--soft)}
.qbox{display:flex;gap:12px;align-items:center;background:var(--soft);border:3px solid var(--ink);border-radius:14px;padding:12px;margin:10px 0 12px}
.qbox .em{font-size:44px;line-height:1}
.qbox p{margin:0;font-size:19px;font-weight:900}
.answers{grid-template-columns:1fr 1fr}
@media (max-width:480px){.answers{grid-template-columns:1fr}}
/* backpack */
.bag{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.bag button{background:var(--card);border:3px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);padding:6px 12px;font-weight:900;font-size:15px}
.bag button.active{background:var(--yellow);color:#1E1846}
.bag button:disabled{opacity:.4;cursor:not-allowed}
/* shop */
.shop{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.item{background:var(--card);padding:14px;display:flex;flex-direction:column;gap:6px}
.item .em{font-size:40px;line-height:1}
.price{display:flex;align-items:center;gap:6px;font-family:"Lilita One",sans-serif;font-size:20px}
.price .coin{--s:22px}
.limit{font-size:13px;color:var(--muted)}
.banner{background:var(--yellow);color:#1E1846;border:3px solid var(--ink);border-radius:16px;padding:12px 14px;margin-bottom:14px;box-shadow:0 4px 0 var(--ink)}
.big{font-family:"Lilita One",sans-serif;font-size:clamp(40px,12vw,72px);line-height:1}
.toast{position:fixed;left:50%;top:38%;z-index:20;transform:translate(-50%,-50%);font-family:"Lilita One",sans-serif;font-size:clamp(36px,10vw,64px);color:var(--yellow);-webkit-text-stroke:3px #1E1846;paint-order:stroke fill;pointer-events:none;animation:pop 1.1s ease-out forwards;white-space:nowrap}
.toast.neg{color:var(--red)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hud .rankpill{font-size:16px}
.stars{font-size:15px;letter-spacing:1px}
.zone.locked{opacity:.6}
.lockmsg{font-size:13px;color:var(--muted)}
/* drag */
.piece{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.piece.lifted{opacity:.3}
.piece.sel{outline:4px solid var(--yellow);outline-offset:2px}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;transform:scale(1.06) rotate(-2deg);box-shadow:0 10px 18px rgba(0,0,0,.3)!important}
[data-drop].hover{outline:4px dashed var(--pink);outline-offset:2px}
[data-drop].bad{animation:shake .35s;background-color:var(--red)!important}
/* jigsaw */
.jig{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}.jig .side{text-align:center}
@media (max-width:600px){.jig{grid-template-columns:1fr}}
.frame{--n:3;width:min(330px,86vw);aspect-ratio:1;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;padding:6px;background:#8B5A2B;border:4px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);margin:0 auto}
.slot{background:rgba(255,255,255,.35);border:2px dashed rgba(30,24,70,.5);border-radius:4px;display:grid;place-items:center;color:rgba(30,24,70,.5);font-family:"Lilita One",sans-serif;font-size:20px}
.slot.filled{border:0;border-radius:2px}
.jp{background-size:300% 300%;background-repeat:no-repeat}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.tray .piece{width:min(84px,24vw);aspect-ratio:1;border:3px solid var(--ink);border-radius:8px;box-shadow:0 3px 0 var(--ink);padding:0}
.peek{width:110px;aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;background-size:cover}
/* map */
.mapwrap{position:relative;width:min(560px,100%);margin:0 auto;border:4px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.mapwrap svg{display:block;width:100%;height:auto}
.mk{position:absolute;transform:translate(-50%,-50%);min-width:38px;height:38px;border-radius:999px;border:3px solid var(--ink);background:#fff;color:#1E1846;display:grid;place-items:center;font-family:"Lilita One",sans-serif;font-size:16px;padding:0 6px;box-shadow:0 3px 0 var(--ink)}
.mk.ok{background:var(--yellow)}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.lab{background:var(--card);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:8px 10px;text-align:left}
.lab b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:19px;display:block}
.lab span{font-size:13px;color:var(--muted)}
/* timeline & sort */
.tl{display:grid;gap:8px;margin-bottom:12px}
.tslot{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:stretch}
.tdate{background:var(--purple);color:#fff;border:3px solid var(--ink);border-radius:12px;display:grid;place-items:center;font-family:"Lilita One",sans-serif;font-size:17px;text-align:center;padding:4px}
.tbox{min-height:54px;border:3px dashed var(--ink);border-radius:12px;background:var(--soft);display:flex;align-items:center;padding:6px 10px;font-weight:800}
.tbox.ok{border-style:solid;background:var(--okbg)}
.cards{display:flex;flex-direction:column;gap:8px}
.cardp{background:var(--card);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:10px;text-align:left;font-weight:800;width:100%}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.bin{border:3px dashed var(--ink);border-radius:16px;background:var(--soft);min-height:150px;padding:8px;display:flex;flex-direction:column;gap:6px}
.bin h3{text-align:center;margin:0 0 4px;font-size:18px}
.bin .done{background:var(--okbg);border:2px solid var(--ink);border-radius:10px;padding:6px 8px;font-size:14px}
.fact{background:var(--okbg);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;margin-top:12px}
.relics{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.relic{background:var(--card);padding:12px;display:flex;flex-direction:column;gap:4px;text-align:center;align-items:center}
.relic .em{font-size:44px}
.relic.owned{background:var(--okbg)}
.relic .fx{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin:8px 0 14px}
.tabs button{flex:1;background:var(--soft);border:3px solid var(--ink);border-radius:14px;padding:8px;font-family:"Lilita One",sans-serif;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.tabs button.on{background:var(--yellow);color:#1E1846}
.ranks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ranks span{border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:14px;background:var(--soft)}
.ranks span.on{background:var(--yellow);color:#1E1846}
.dock{position:sticky;bottom:0;z-index:3;background:var(--card);border-top:3px solid var(--ink);margin:12px -16px -16px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));max-height:36vh;overflow-y:auto;border-radius:0 0 15px 15px;box-shadow:0 -6px 12px rgba(30,24,70,.12)}
.dock::before{content:"Drag from here ⬆";display:block;width:100%;text-align:center;font-size:12px;color:var(--muted);margin-bottom:6px;flex-basis:100%;grid-column:1/-1}
.frame{width:min(330px,86vw,44vh)}
@media (max-width:480px){.hud{gap:6px;padding:8px}.pill{font-size:16px;padding:3px 9px 3px 4px}.badge{width:28px;height:28px;font-size:11px}.coin{--s:24px}.hudbtn{font-size:15px;padding:5px 9px}.hud .tn{display:none}.lab{padding:6px 8px}.lab b{font-size:17px}}
@media (max-width:600px){.jig .side{display:flex;align-items:center;gap:10px;justify-content:center}.jig .peek{width:72px}}

.codein{font-size:17px;letter-spacing:.04em;width:min(320px,100%)}
.codebox{font-family:"Lilita One",sans-serif;font-size:clamp(20px,5.5vw,30px);letter-spacing:.06em;background:var(--soft);border:3px dashed var(--ink);border-radius:14px;padding:14px;word-break:break-all;text-align:center;user-select:all;-webkit-user-select:all}
.prog{height:14px;border:3px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--green)}
.scrollitem{display:flex;gap:12px;align-items:flex-start;border-bottom:2px dashed var(--soft);padding:10px 0}
.scrollitem .em{font-size:30px;line-height:1}
.scrollitem p{margin:4px 0 0;font-weight:700}
.lockedfact{opacity:.55}
</style>
</head>
<body>
<header class="hud hide" id="hud"></header>
<main id="app"></main>
<script>
(function(){
"use strict";
const KEY="qinquest-v4", ZONE_MS=4*60*1000, RUSH_PER_DAY=2;
const TEAMS=[{id:"qin",name:"Qin",color:"#E0A100"},{id:"chu",name:"Chu",color:"#FF4B4B"},{id:"qi",name:"Qi",color:"#2E9BFF"},{id:"yan",name:"Yan",color:"#2FCB75"},{id:"han",name:"Han",color:"#FF8C42"},{id:"zhao",name:"Zhao",color:"#8A4FFF"},{id:"wei",name:"Wei",color:"#FF5DA2"}];
const RANKS=[[0,"💰","Merchant"],[60,"🔨","Craftsman"],[140,"🌾","Farmer"],[250,"🏯","Noble"],[400,"👑","Emperor"]];

    show.forEach(o=>g.append(el("button",{class:"tile"+(o===q[2][0]?" ok":o===d.answered?" bad":""),disabled:true},el("span",{text:o}))));
    c.append(g, el("div",{class:"fact",text:(d.answered===q[2][0]?"✅ Correct! ":"❌ The answer is: "+q[2][0]+". ")+q[3]}),
      el("div",{class:"row",style:"margin-top:12px"},el("button",{class:"btn go press",onclick:()=>{ const ok=d.answered===q[2][0]; d.answered=null; store(); onDone(ok); },text:"Next ➜"})));
  } else {
    show.forEach(o=>g.append(el("button",{class:"tile press",onclick:()=>{ d.answered=o; if(o===q[2][0]) onRight(); else onWrong(); store(); render(); }},el("span",{text:o}))));
    c.append(g);
  }
  var onRight=()=>{}, onWrong=()=>{};
  return { set right(f){ onRight=f; }, set wrong(f){ onWrong=f; } };
}
/* ---------- Zone: boss ---------- */
function boss(){
  const r=R(), d=r.d; if(d.q==null){ d.q=0; d.lives=3; d.order=shuffle([...Array(12).keys()]).slice(0,10); store(); }
  const qi=d.order[d.q], q=BANK[qi];
  useHint=()=>{ if(d.answered||d.removed&&d.removed[qi]) return false; d.removed=d.removed||{}; d.opts=d.opts||{}; const opts=d.opts[qi]||(d.opts[qi]=shuffle(q[2])); d.removed[qi]=opts.filter(o=>o!==q[2][0]).slice(0,2); toast("💡 Two wrong answers gone!"); return true; };
  const hp=d.order.length-d.q;
  const c=el("section",{class:"card chunky"},zoneTop([
    "Answer questions about everything you’ve learned to attack Qin Shi Huang.",
    "Each right answer = 2 coins and knocks off some of his health.",
    "You have 3 lives. Beat him for a 5-coin bonus!"]));
  c.append(el("div",{class:"boss"},el("div",{class:"bossface"+(d.answered===q[2][0]?" hit":""),"aria-hidden":"true",text:"👑"}),
    el("div",{style:"flex:1"},el("h3",{style:"margin:0",text:"Qin Shi Huang"}),el("div",{class:"hpbar",role:"img","aria-label":"Boss health "+hp+" of "+d.order.length},...d.order.map((_,i)=>el("i",{class:i<hp?"":"gone"})))),
    el("div",{style:"font-size:22px","aria-label":d.lives+" lives",text:"❤️".repeat(Math.max(0,d.lives))+"🖤".repeat(3-Math.max(0,d.lives))})));
  c.append(el("div",{class:"muted",text:"Question "+(d.q+1)+" of "+d.order.length}));
  const h=questionCard(c,d,qi,ok=>{
    if(ok){ d.q++; if(d.q>=d.order.length){ earn(5); return finishZone(false); } }
    else if(d.lives<=0) return finishZone(false,true);
    render();
  });
  h.right=()=>{ earn(2); }; h.wrong=()=>{ d.lives--; miss(); };
  app.append(c);
}
/* ---------- Zone: revision rush ---------- */
function rush(){
  const r=R(), d=r.d; if(!d.qs){ d.qs=shuffle(BANK.map((_,i)=>i)).slice(0,10); d.k=0; d.score=0; store(); }
  const qi=d.qs[d.k];
  useHint=()=>{ if(d.answered||d.removed&&d.removed[qi]) return false; d.removed=d.removed||{}; d.opts=d.opts||{}; const q=BANK[qi]; const opts=d.opts[qi]||(d.opts[qi]=shuffle(q[2])); d.removed[qi]=opts.filter(o=>o!==q[2][0]).slice(0,2); toast("💡 Two wrong answers gone!"); return true; };
  const c=el("section",{class:"card chunky"},zoneTop([
    "10 random questions from everything in the unit, just like a quick exam practice.",
    "Read the explanation after each answer, even when you’re right!",
    r.practice?"Practice round: no coins, just learning.":"+1 coin for each right answer. You get "+RUSH_PER_DAY+" coin rounds per day."]));
  c.append(el("div",{class:"row",style:"justify-content:space-between"},el("span",{class:"muted",text:"Question "+(d.k+1)+" of "+d.qs.length}),el("span",{class:"muted",text:"Score: "+d.score})));
  const h=questionCard(c,d,qi,()=>{ d.k++; store(); if(d.k>=d.qs.length) finishZone(false); else render(); });
  h.right=()=>{ d.score++; earn(1); }; h.wrong=()=>{ r.mist++; };
  app.append(c);
}
render();
})();
